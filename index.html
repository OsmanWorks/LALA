<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI Live Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10051c;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--text:#fff3fa;--muted:#c9b0dc;--pink:#ff3d9a;--orange:#ff9a3c;--violet:#8a4dff;--live:#2fe3a8;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10051c}}
:root[data-theme="dark"]{--bg:#10051c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;cursor:none;font-family:Outfit,system-ui,"Segoe UI",sans-serif;color:var(--text)}
#stage{pointer-events:none;user-select:none;position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
 background:radial-gradient(1100px 600px at 50% -15%,rgba(255,61,154,.45),transparent 70%),radial-gradient(900px 600px at 100% 40%,rgba(138,77,255,.3),transparent 70%),linear-gradient(180deg,#1f0a36,var(--bg) 55%)}
.abs{position:absolute}
.head{left:0;top:0;width:1920px;height:84px;display:flex;align-items:center;justify-content:center}
.logo{font-family:Unbounded;font-weight:900;font-size:46px;letter-spacing:.01em}
.logo b{background:linear-gradient(90deg,var(--orange),var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{left:60px;top:28px;font-size:20px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px}
.pill{right:60px;top:20px;display:flex;align-items:center;gap:10px;height:44px;padding:0 20px;border:1px solid var(--line);background:var(--panel);border-radius:99px;font-size:19px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pink);animation:ping 1.6s infinite}
.dot.on{background:var(--live);animation-name:ping2}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,61,154,.7)}80%,100%{box-shadow:0 0 0 12px rgba(255,61,154,0)}}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(47,227,168,.7)}80%,100%{box-shadow:0 0 0 12px rgba(47,227,168,0)}}
.mapbox{left:60px;top:92px;width:1250px;height:493px;border:1px solid var(--line);border-radius:20px;background:rgba(10,3,20,.55);overflow:hidden}
svg{display:block;width:100%;height:100%}
.c{stroke:rgba(10,3,20,.9);stroke-width:.35;transition:fill .6s}
.c.sel{stroke:#fff;stroke-width:1.5}
.c.flash{animation:fl 1.1s 5}@keyframes fl{50%{fill:#fff}}
.chip rect{fill:rgba(12,4,24,.9);stroke:rgba(255,255,255,.35);stroke-width:.6}
.chip.live rect{stroke:var(--live);fill:rgba(8,50,38,.94)}.chip.sel rect{stroke:var(--pink);stroke-width:1.8}
.chip text{fill:#fff;text-anchor:middle;font-family:Outfit;font-weight:600}.chip .n{font-size:8.5px;fill:#d8c3e8}.chip .t{font-size:9.5px;font-family:Unbounded;font-weight:500}
.chip.live .t{fill:var(--live)}.chip.sel .n{fill:#fff}
.wave{stroke:#fff;stroke-width:1.4;filter:drop-shadow(0 0 5px var(--pink)) drop-shadow(0 0 10px var(--pink));opacity:.85}
.hero{left:60px;top:600px;width:790px;height:392px;padding:2px 4px}
.lab{font-size:20px;color:var(--muted);font-weight:500;height:26px}
.rn{display:flex;align-items:center;gap:16px;font-family:Unbounded;font-weight:700;font-size:36px;height:52px;white-space:nowrap}
.rn img{width:66px;height:44px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.5);flex:none}
.big{font-family:Unbounded;font-weight:900;font-size:112px;line-height:1.1;height:128px;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em;
 background:linear-gradient(95deg,var(--orange),var(--pink) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(255,61,154,.4))}
.big small{font-size:.3em;opacity:.8}
.big.rel{background:linear-gradient(95deg,#8fffd9,var(--live));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 30px rgba(47,227,168,.45))}
.meta{display:flex;gap:12px;margin-top:10px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:7px 16px;flex:1}
.card i{display:block;font-style:normal;font-size:14px;color:var(--muted)}.card b{font-size:20px;font-weight:600;white-space:nowrap}
.mid{left:870px;top:600px;width:440px;height:392px}
h3{font-family:Unbounded;font-size:17px;margin:0 0 10px;font-weight:700}
.nx{display:flex;justify-content:space-between;align-items:center;height:50px;padding:0 16px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:22px;font-weight:600}
.nx.first{background:linear-gradient(90deg,rgba(255,61,154,.3),rgba(255,154,60,.1));border-color:rgba(255,61,154,.6)}
.nx span:first-child{display:flex;align-items:center;gap:12px}.nx img{width:36px;height:24px;border-radius:3px}
.nx span:last-child{font-family:Unbounded;font-weight:500;font-size:19px;font-variant-numeric:tabular-nums}
.fact{margin-top:6px;padding:12px 18px;border-radius:14px;border:1px solid rgba(138,77,255,.5);background:rgba(138,77,255,.16);font-size:19px;line-height:1.35;height:130px;display:flex;align-items:center;transition:opacity .5s}
.fact b{color:var(--orange)}
.list{left:1340px;top:92px;width:520px;height:900px;border:1px solid var(--line);border-radius:20px;background:var(--panel);overflow:hidden}
.lh{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(10,3,20,.5);position:relative;z-index:2}
.lh h3{margin:0}.lh span{font-size:15px;color:var(--muted)}
.view{position:absolute;left:0;right:0;top:56px;bottom:0;overflow:hidden;-webkit-mask:linear-gradient(180deg,transparent,#000 4%,#000 94%,transparent);mask:linear-gradient(180deg,transparent,#000 4%,#000 94%,transparent)}
.sc{animation:up 160s linear infinite}
@keyframes up{to{transform:translateY(-50%)}}
.sr{display:flex;align-items:center;gap:14px;height:62px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sr img{width:44px;height:29px;border-radius:4px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sr .nm{flex:1;min-width:0;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .nm small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.sr .cd{font-family:Unbounded;font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;color:var(--orange)}
.sr .cd.rl{color:var(--live);font-size:17px}
.prog{left:0;top:1000px;width:1920px;height:6px;background:rgba(255,255,255,.1)}
.pf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--orange),var(--pink),var(--violet))}
.bar{left:0;top:1006px;width:1920px;height:74px;display:flex;background:#0a0314;border-top:1px solid var(--line);overflow:hidden}
.bl{flex:none;display:flex;align-items:center;gap:12px;padding:0 34px;background:linear-gradient(90deg,var(--pink),var(--orange));font-family:Unbounded;font-weight:900;font-size:24px;color:#1a0420;z-index:2}
.bl i{width:14px;height:14px;border-radius:50%;background:#1a0420;animation:ping 1.6s infinite}
.tk{flex:1;overflow:hidden;position:relative}
.tr{display:flex;position:absolute;left:0;top:0;height:100%;align-items:center;white-space:nowrap;animation:mq 190s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.ti{display:inline-flex;align-items:center;gap:12px;font-size:28px;font-weight:600;padding-right:26px}
.ti img{width:42px;height:28px;border-radius:4px}.ti .tm{font-family:Unbounded;font-weight:500;font-size:25px;font-variant-numeric:tabular-nums;color:var(--orange)}
.ti .tm.rl{color:var(--live)}.ti u{text-decoration:none;color:var(--pink);font-size:20px;padding-left:12px}
.toast{left:50%;top:-140px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:16px;padding:16px 40px;border-radius:20px;background:linear-gradient(90deg,#0f6e52,var(--live));color:#04281d;font-family:Unbounded;font-weight:700;font-size:30px;box-shadow:0 20px 70px rgba(47,227,168,.55);white-space:nowrap;transition:top .6s cubic-bezier(.2,1.3,.4,1)}
.toast img{width:60px;height:40px;border-radius:5px}.toast.show{top:96px}
@media (prefers-reduced-motion:reduce){.dot,.c.flash,.bl i{animation:none}}
</style></head><body>
<div id="stage">
<div class="abs head"><div class="logo">Grand Theft Auto <b>VI</b></div></div>
<div class="abs sub"><i class="dot" id="dot"></i><span>Live release countdown</span></div>
<div class="abs pill"><span id="status">—</span></div>
<div class="abs toast" id="toast"></div>

<div class="abs mapbox"><svg id="svg" viewBox="0 0 1000 394" preserveAspectRatio="xMidYMid meet"><g id="countries"></g><line class="wave" id="wave" x1="0" x2="0" y1="0" y2="394"/><g id="chips"></g></svg></div>

<div class="abs hero">

 <div class="rn" id="rn">—</div>
 <div class="big" id="big">00:00:00</div>
 <div class="meta">
  <div class="card"><i>Local unlock time</i><b id="m1">—</b></div>
  <div class="card"><i>Pakistan time</i><b id="m3">—</b></div>
  <div class="card"><i>Released in</i><b id="m4">—</b></div>
 </div>
</div>

<div class="abs prog"><div class="pf" id="pf"></div></div>
<div class="abs bar"><div class="bl"><i></i>LIVE</div><div class="tk"><div class="tr" id="tr"></div></div></div>
</div>
